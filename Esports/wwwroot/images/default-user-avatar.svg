<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Headset & Visor Glow -->
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Skin/Face Silhouette Gradient -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Accent Gold / Orange -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" filter="url(#avatarGlow)" />

  <!-- Subtle Cyber Ring Pattern -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,6" />

  <!-- Clip Path for Inside the Circle -->
  <clipPath id="circleClip">
    <circle cx="100" cy="100" r="92" />
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Gamer Torso / Shoulders / Jersey -->
    <path d="M 30 190 C 30 148, 65 138, 100 138 C 135 138, 170 148, 170 190 Z" 
          fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Esports Jersey Collar / Armor Detail -->
    <path d="M 75 142 L 100 162 L 125 142" 
          fill="none" stroke="url(#headsetGrad)" stroke-width="3" stroke-linecap="round" />
    <polygon points="100,165 92,176 108,176" fill="url(#accentGrad)" />

    <!-- Neck -->
    <path d="M 85 120 L 85 142 L 115 142 L 115 120 Z" fill="#1e293b" />

    <!-- Head / Face Silhouette -->
    <path d="M 70 82 C 70 50, 130 50, 130 82 C 130 114, 116 126, 100 126 C 84 126, 70 114, 70 82 Z" 
          fill="url(#faceGrad)" />

    <!-- Sleek Esports Visor / Glasses -->
    <path d="M 68 80 C 78 74, 122 74, 132 80 C 130 92, 122 95, 100 95 C 78 95, 70 92, 68 80 Z" 
          fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <path d="M 72 82 C 82 77, 118 77, 128 82 C 124 88, 116 91, 100 91 C 84 91, 76 88, 72 82 Z" 
          fill="url(#headsetGrad)" opacity="0.85" />
    <!-- Visor Glint -->
    <line x1="80" y1="83" x2="98" y2="83" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />

    <!-- Esports Gaming Headset -->
    <!-- Headband -->
    <path d="M 62 82 C 62 46, 138 46, 138 82" 
          fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" />
    <path d="M 65 80 C 65 50, 135 50, 135 80" 
          fill="none" stroke="url(#headsetGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Left Ear Cup -->
    <rect x="54" y="70" width="13" height="28" rx="6.5" 
          fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="60.5" cy="84" r="3.5" fill="#38bdf8" />

    <!-- Right Ear Cup -->
    <rect x="133" y="70" width="13" height="28" rx="6.5" 
          fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="139.5" cy="84" r="3.5" fill="#38bdf8" />

    <!-- Headset Microphone Boom -->
    <path d="M 64 92 C 64 110, 80 115, 96 112" 
          fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <!-- Mic Tip with Neon LED -->
    <rect x="94" y="108" width="8" height="7" rx="2" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="98" cy="111.5" r="1.5" fill="#22c55e" />
  </g>
</svg>
